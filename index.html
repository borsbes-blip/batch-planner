<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batch планер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js"></script>
<style>
/* Тема: кухня с заготовками. Стеклянные контейнеры, малярный скотч с подписью, свежая зелень. */
:root{
  --paper:#eef2ec; --glass:#fbfdfa; --ink:#16231c; --soft:#5d6d63; --rule:#d3dbd2;
  --herb:#2f6b4f; --herb-wash:#dcebe1; --tape:#f2d27a; --tape-ink:#3a2f12; --tomato:#d9472f;
  --display:"Unbounded",system-ui,sans-serif; --text:"Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111915; --glass:#1a241f; --ink:#e7efe9; --soft:#9aaba0; --rule:#2b3831;
    --herb:#6fc199; --herb-wash:#1f3a2c; --tape:#e6c567; --tape-ink:#2e250c; --tomato:#f06b52;
  }
}
:root[data-theme="dark"]{
  --paper:#111915; --glass:#1a241f; --ink:#e7efe9; --soft:#9aaba0; --rule:#2b3831;
  --herb:#6fc199; --herb-wash:#1f3a2c; --tape:#e6c567; --tape-ink:#2e250c; --tomato:#f06b52;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--herb);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 132px}

/* Шапка и профили */
.top{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 14px}
.brand{font:700 21px/1 var(--display);letter-spacing:-.02em}
.brand small{font:500 13px var(--text);color:var(--soft);margin-left:6px;letter-spacing:0}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.person{background:transparent;border:0;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--rule)}
.person b{display:block;font-weight:600;font-size:15px}
.person span{font:500 19px/1.2 var(--display);letter-spacing:-.02em}
.person span small{font:400 12px var(--text);color:var(--soft);margin-left:4px}
.person.on{background:var(--herb);color:var(--glass);box-shadow:none}
.person.on span small{color:inherit;opacity:.8}

.goals{display:flex;background:var(--glass);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--rule);margin-bottom:6px}
.goals button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-weight:500;font-size:14px;cursor:pointer;color:var(--soft)}
.goals button.on{background:var(--herb-wash);color:var(--ink);font-weight:600}
.note{font-size:12.5px;color:var(--soft);margin:0 2px 12px}

details.params{margin:0 0 18px;border-radius:16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--rule)}
details.params summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.params summary::-webkit-details-marker{display:none}
details.params summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details.params[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.params summary span{color:var(--soft);font-size:13px;margin-left:auto;margin-right:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.form label{font-size:12.5px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.form input,.form select{background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:9px 10px;width:100%;font-size:15px}
.form .wide{grid-column:1/-1}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font:500 16px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--soft)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin:0 2px}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--glass);transition:transform .2s}
.switch input:checked{background:var(--herb)}
.switch input:checked::after{transform:translateX(16px)}

/* Контейнеры с блюдами: главный визуальный приём */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.box{position:relative;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.lid{position:relative;height:96px;border-radius:20px;background:var(--glass);box-shadow:inset 0 0 0 2px var(--rule);display:flex;align-items:center;justify-content:center;font-size:42px;transition:box-shadow .15s,background .15s}
.lid::before,.lid::after{content:"";position:absolute;top:34px;width:7px;height:28px;border-radius:4px;background:var(--rule);transition:background .15s}
.lid::before{left:-3px}.lid::after{right:-3px}
.box.on .lid{background:var(--herb-wash);box-shadow:inset 0 0 0 2.5px var(--herb)}
.box.on .lid::before,.box.on .lid::after{background:var(--herb)}
.tape{position:relative;margin:-14px 10px 0;padding:7px 10px 8px;background:var(--tape);color:var(--tape-ink);font-weight:600;font-size:13.5px;line-height:1.22;transform:rotate(-1.2deg);
  clip-path:polygon(0 4%,3% 0,97% 3%,100% 0,99% 50%,100% 97%,96% 100%,4% 97%,0 100%,1% 50%)}
.box:nth-child(even) .tape{transform:rotate(1deg)}
.facts{display:flex;justify-content:space-between;align-items:baseline;margin:8px 4px 0;font-size:12.5px;color:var(--soft)}
.facts b{font:500 15px var(--display);color:var(--ink);letter-spacing:-.02em;margin-right:3px}
.facts .warm{color:var(--tomato)}
.stamp{position:absolute;top:8px;right:10px;font-size:12px;font-weight:600;color:var(--glass);background:var(--herb);border-radius:999px;padding:2px 9px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.box.on .stamp{opacity:1;transform:scale(1)}
.box:active .lid{transform:scale(.97)}
.warn{font-size:13px;color:var(--tomato);margin:14px 2px 0}

/* Нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--glass);box-shadow:0 -1px 0 var(--rule);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:520px;margin:0 auto}
.meter{position:relative;height:8px;border-radius:999px;background:var(--rule);margin:2px 0 10px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--herb);transition:width .35s ease}
.meter.over i{background:var(--tomato)}
.bar .row{display:flex;align-items:center;gap:12px}
.bar .read{flex:1;font-size:12.5px;color:var(--soft);line-height:1.35}
.bar .read b{font:500 17px var(--display);color:var(--ink);letter-spacing:-.02em}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;background:var(--herb);color:var(--glass);white-space:nowrap}
.btn:disabled{background:var(--rule);color:var(--soft);cursor:default}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.full{width:100%}

/* Экран недели */
.back{border:0;background:transparent;color:var(--soft);padding:4px 0;cursor:pointer;font-size:14px;margin-bottom:6px}
.headline{font:700 26px/1.12 var(--display);letter-spacing:-.03em;margin:4px 0 8px}
.lede{font-size:15.5px;margin:0 0 18px;color:var(--soft)}
.lede b{color:var(--ink);font-weight:600}
.lede .ok{color:var(--herb)}.lede .bad{color:var(--tomato)}
.panel{background:var(--glass);border-radius:18px;box-shadow:inset 0 0 0 1px var(--rule);padding:14px;margin-bottom:12px}
.panel h3{font:500 15px var(--display);margin:0 0 10px;letter-spacing:-.01em}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--soft);font-size:12.5px;text-align:right;padding:0 0 6px}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 0;border-top:1px solid var(--rule);text-align:right}
.tbl td:first-child{text-align:left;color:var(--soft)}
.budget{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.budget input{width:96px;text-align:right;background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.small{font-size:12.5px;color:var(--soft);margin:8px 0 0}
.pack{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.pack:first-of-type{border-top:0;padding-top:0}
.pack .e{font-size:24px;width:30px;text-align:center}
.pack .t{flex:1;font-size:14px;line-height:1.25}
.pack .c{display:flex;gap:6px}
.chip{font-size:12.5px;background:var(--herb-wash);border-radius:8px;padding:3px 8px;white-space:nowrap}
.chip b{font-weight:600}
.dept{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.dept h4{margin:0;font-weight:600;font-size:14.5px}
.dept span{font-size:12.5px;color:var(--soft)}
.dept.done span{color:var(--herb);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}
.item input{appearance:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--rule);flex:none;cursor:pointer;display:grid;place-content:center;margin:0}
.item input:checked{background:var(--herb);box-shadow:none}
.item input:checked::after{content:"";width:6px;height:11px;border:solid var(--glass);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .n{flex:1;font-size:15px}
.item .q{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px;white-space:nowrap}
.item.done .n{text-decoration:line-through;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,8px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) {
  try {
    tg.ready(); tg.expand();
    const applyTheme = () => {
      document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
      if (tg.setHeaderColor) tg.setHeaderColor(bg);
      if (tg.setBackgroundColor) tg.setBackgroundColor(bg);
      if (tg.setBottomBarColor) tg.setBottomBarColor(bg);
    };
    applyTheme(); tg.onEvent("themeChanged", applyTheme);
    tg.BackButton.onClick(() => { S.view = "plan"; save(); render(); window.scrollTo(0,0); });
  } catch(e){}
}
const haptic = () => { try { inTg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch(e){} };

const RECIPES = window.RECIPES_DB.recipes;
const EMOJI = {"chicken-rice-teriyaki":"🍗","buckwheat-beef":"🥘","bolognese":"🍝","chicken-burrito":"🌯","chicken-plov":"🍛","turkey-meatballs-bulgur":"🧆","potato-casserole":"🥧","chicken-curry":"🍛","thighs-potato-mushrooms":"🍄","chili":"🌶️","chicken-cutlets-mash":"🥔","chicken-stroganoff":"🍲",
  "lagman":"🍜","mexican-chicken-rice":"🌽","lazy-golubtsy":"🥬","creamy-chicken-pasta":"🧀","turkey-ragout":"🥕","stuffed-peppers":"🫑",
  "pasta-bake-broccoli":"🥦","lentil-dal-chicken":"🫘","lavash-lasagna":"🫓","beef-goulash-mash":"🥩"};

// Завтрак + перекус на день: эталон ~986 ккал, 74 г белка. Масштабируется под норму каждого.
const BFAST = {kcal:986, protein:74, items:[
  ["яйцо",165,"Молочка и яйца"],["творог 5%",200,"Молочка и яйца"],["овсяные хлопья",50,"Крупы и макароны"],
  ["молоко 2,5%",200,"Молочка и яйца"],["банан",120,"Фрукты"],["кефир 1%",250,"Молочка и яйца"]]};
const PIECE = {"яйцо":55,"банан":120};
// Примерные цены, ₽ за кг (или за шт для штучного). Уточним по чекам.
const PRICE = {"филе куриной грудки":480,"филе куриного бедра":420,"фарш куриный":380,"фарш говяжий":650,"фарш индейки":520,
 "рис":120,"гречка":110,"макароны":150,"булгур":160,"овсяные хлопья":90,"картофель":50,"лук":40,"морковь":45,"перец болгарский":300,
 "шампиньоны":300,"овощная смесь замороженная":250,"томаты в собственном соку":250,"фасоль красная консервированная":250,"томатная паста":300,
 "соевый соус":400,"мёд":700,"масло растительное":180,"масло сливочное":1000,"сыр лёгкий 30%":900,"сметана 15%":300,"сливки 10%":350,
 "молоко 2,5%":90,"яйцо":12,"творог 5%":500,"кефир 1%":100,"банан":20,"лаваш тонкий":300,
 "говядина (лопатка)":750,"филе бедра индейки":550,"кукуруза консервированная":300,"капуста белокочанная":40,"брокколи замороженная":350,"чечевица красная":200};
const CAT_ORDER = ["Мясо и птица","Молочка и яйца","Овощи и зелень","Фрукты","Крупы и макароны","Хлеб","Бакалея"];
const DISH_SHARE = 0.6; // обед + ужин = 60% нормы, завтрак + перекус = 40%

// Личные данные в коде не храним: каждый вводит свои параметры в приложении.
const DEF = {active:"a", view:"plan", selected:[], breakfasts:true, checked:{}, budget:5000, setup:false,
  profiles:{
    a:{name:"Муж",sex:"m",age:30,height:180,weight:90,target:80,act:1.375,goal:"lose"},
    b:{name:"Жена",sex:"f",age:30,height:165,weight:65,target:58,act:1.375,goal:"lose"}}};
const KEY = "batch-planner";
const cloud = tg && tg.initData && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
if (!S) S = JSON.parse(JSON.stringify(DEF));
if (!S.budget) S.budget = 5000;
if (S.setup === undefined) S.setup = true; // старые сохранения уже настроены
let cloudTimer;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  // Облако Telegram: настройки не теряются при очистке кэша и переезжают на новый телефон
  if (cloud) { clearTimeout(cloudTimer); cloudTimer = setTimeout(()=>{ try { cloud.setItem(KEY, JSON.stringify(S)); } catch(e){} }, 600); }
}
if (cloud) cloud.getItem(KEY, (err, val) => {
  if (err || !val) return;
  try { const c = JSON.parse(val); if (c && c.profiles) { S = c; try { localStorage.setItem(KEY, val); } catch(e){} render(); } } catch(e){}
});

function norms(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="m"?5:-161);
  const tdee = bmr*p.act;
  const bmi = p.weight/Math.pow(p.height/100,2);
  const k = {lose: 1-(bmi>=30?0.24:0.20), keep:1, gain:1.1};
  const r10 = x => Math.round(x/10)*10;
  const ref = bmi>=25 ? (p.target||p.weight) : p.weight;
  return {lose:r10(tdee*k.lose), keep:r10(tdee), gain:r10(tdee*k.gain), kcal:r10(tdee*k[p.goal]),
          protein:Math.round(1.8*ref), bmi:bmi, deficit:bmi>=30?24:20};
}
function selRecipes(){ return RECIPES.filter(r => S.selected.includes(r.id)); }
function planFor(p){
  const n = norms(p), sel = selRecipes();
  if (!sel.length) return {n, factor:0, day:0, prot:0, dishK:0, bK:0};
  const avgK = sel.reduce((a,r)=>a+r.kcal,0)/sel.length;
  const avgP = sel.reduce((a,r)=>a+r.protein,0)/sel.length;
  let factor = Math.round((DISH_SHARE*n.kcal)/(2*avgK)/0.05)*0.05;
  factor = Math.min(1.6, Math.max(0.5, factor));
  const dishK = 2*avgK*factor, bK = (1-DISH_SHARE)*n.kcal;
  const prot = 2*avgP*factor + BFAST.protein*bK/BFAST.kcal;
  return {n, factor, dishK, bK, day:dishK+bK, prot};
}
// 14 приёмов (обед+ужин x 7) на человека, распределяем по выбранным блюдам
function portionsPerDish(){
  const sel = selRecipes(), base = Math.floor(14/sel.length), extra = 14%sel.length;
  return sel.map((r,i)=>({r, n: base + (i<extra?1:0)}));
}
function shoppingList(){
  const people = Object.values(S.profiles).map(planFor);
  const totals = {}, dishT = {}, bfT = {};
  const add = (map,name,g,cat) => { map[name] = map[name] || {g:0,cat}; map[name].g += g; };
  portionsPerDish().forEach(({r,n}) => {
    const mult = people.reduce((a,pl)=>a + n*pl.factor, 0);
    r.ingredients.forEach(([name,g,cat]) => { add(totals,name,g*mult,cat); add(dishT,name,g*mult,cat); });
  });
  if (S.breakfasts) people.forEach(pl => {
    const k = pl.bK/BFAST.kcal*7;
    BFAST.items.forEach(([name,g,cat]) => { add(totals,name,g*k,cat); add(bfT,name,g*k,cat); });
  });
  const costOf = map => Object.entries(map).reduce((a,[name,{g}]) =>
    a + (PIECE[name] ? Math.ceil(g/PIECE[name])*(PRICE[name]||0) : g/1000*(PRICE[name]||0)), 0);
  const r100 = x => Math.round(x/100)*100;
  const groups = {};
  let cost = 0;
  Object.entries(totals).forEach(([name,{g,cat}]) => {
    let qty, price = PRICE[name]||0;
    if (PIECE[name]) { const pcs = Math.ceil(g/PIECE[name]); qty = pcs+" шт"; cost += pcs*price; }
    else {
      const gr = g<100 ? Math.ceil(g/10)*10 : g<1000 ? Math.ceil(g/50)*50 : Math.ceil(g/100)*100;
      const liq = /молоко|кефир|сливки/.test(name);
      qty = gr>=1000 ? (gr/1000).toLocaleString("ru-RU")+(liq?" л":" кг") : gr+(liq?" мл":" г");
      cost += gr/1000*price;
    }
    (groups[cat] = groups[cat]||[]).push({name, qty});
  });
  return {groups, cost: r100(cost), dishCost: r100(costOf(dishT)), bfCost: r100(costOf(bfT))};
}

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = x => Math.round(x).toLocaleString("ru-RU");
function plural(n,a,b,c){ const m=n%10, h=n%100; return m===1&&h!==11?a : m>=2&&m<=4&&(h<12||h>14)?b : c; }
function trow(t, vals){ return `<tr><td>${t}</td>${vals.map(v=>`<td>${v}</td>`).join("")}</tr>`; }

function peopleTabs(){
  return `<div class="people">${Object.entries(S.profiles).map(([id,q])=>`
    <button class="person ${id===S.active?'on':''}" data-prof="${id}" aria-pressed="${id===S.active}">
      <b>${esc(q.name)}</b><span>${num(norms(q).kcal)}<small>ккал в день</small></span></button>`).join("")}</div>`;
}

function renderPlan(){
  const p = S.profiles[S.active], n = norms(p), pl = planFor(p);
  const goalNote = {lose:`Норма на ${n.deficit}% ниже, чем нужно, чтобы держать вес. Белок ${n.protein} г в день.`,
    keep:`Столько, чтобы вес стоял на месте. Белок ${n.protein} г в день.`,
    gain:`На 10% больше поддержания. Белок ${n.protein} г в день.`}[p.goal];
  document.getElementById("app").innerHTML = `
    <div class="top"><div class="brand">Batch<small>неделя за один день</small></div></div>
    ${peopleTabs()}
    <div class="goals" role="group" aria-label="Цель">${[["lose","Похудеть"],["keep","Держать"],["gain","Набрать"]].map(([g,t])=>`<button data-goal="${g}" class="${p.goal===g?'on':''}">${t}</button>`).join("")}</div>
    <p class="note">${goalNote}</p>
    ${S.setup ? "" : `<p class="note" style="color:var(--herb);font-weight:500">Впишите имя, рост, вес и возраст для каждого из вас. Норма посчитается сама.</p>`}
    <details class="params" ${S.setup?"":"open"}><summary>Параметры <span>${p.height} см, ${p.weight} кг</span></summary>
      <div class="form">
        <label>Имя<input data-f="name" value="${esc(p.name)}"></label>
        <label>Пол<select data-f="sex"><option value="m" ${p.sex==="m"?"selected":""}>мужской</option><option value="f" ${p.sex==="f"?"selected":""}>женский</option></select></label>
        <label>Возраст<input data-f="age" type="number" inputmode="numeric" value="${p.age}"></label>
        <label>Рост, см<input data-f="height" type="number" inputmode="numeric" value="${p.height}"></label>
        <label>Вес сейчас, кг<input data-f="weight" type="number" inputmode="decimal" step="0.1" value="${p.weight}"></label>
        <label>Хочу весить, кг<input data-f="target" type="number" inputmode="decimal" value="${p.target}"></label>
        <label class="wide">Активность<select data-f="act">
          ${[[1.2,"Сидячая, без тренировок"],[1.375,"Тренировки 1–3 раза в неделю"],[1.55,"Тренировки 3–5 раз в неделю"],[1.725,"Тренировки каждый день"]].map(([v,t])=>`<option value="${v}" ${+p.act===v?"selected":""}>${t}</option>`).join("")}
        </select></label>
      </div></details>
    <label class="switch"><input type="checkbox" id="bf" ${S.breakfasts?"checked":""}> Продукты на завтраки и перекусы тоже в список</label>
    <div class="sec"><h2>Блюда на обед и ужин</h2><span>${S.selected.length ? `выбрано ${S.selected.length}` : "2–4 блюда"}</span></div>
    <div class="shelf">${RECIPES.map(r=>{ const on = S.selected.includes(r.id); return `
      <button class="box ${on?'on':''}" data-dish="${r.id}" aria-pressed="${on}">
        <div class="lid" aria-hidden="true">${EMOJI[r.id]||"🍽️"}</div><span class="stamp">в плане</span>
        <div class="tape">${esc(r.name)}</div>
        <div class="facts"><span><b>${r.kcal}</b>ккал</span>${r.freezes?`<span>${r.protein} г белка</span>`:`<span class="warm">не морозить</span>`}</div>
      </button>`;}).join("")}</div>
    ${S.selected.length>4?'<p class="warn">Пять блюд и больше за 4 часа приготовить сложно. Оставьте 3–4.</p>':''}`;
  const ready = S.selected.length>=2, pct = Math.min(100, pl.day/n.kcal*100), over = pl.day>n.kcal*1.05;
  document.getElementById("bar").innerHTML = `<div class="in">
    <div class="meter ${over?'over':''}" role="meter" aria-valuenow="${Math.round(pl.day)}" aria-valuemax="${n.kcal}" aria-label="Калории за день"><i style="width:${pct}%"></i></div>
    <div class="row"><div class="read">${S.selected.length
      ? `<b>${num(pl.day)}</b> из ${num(n.kcal)} ккал<br>белок ${Math.round(pl.prot)} из ${n.protein} г`
      : `<b>0</b> из ${num(n.kcal)} ккал<br>Отметьте блюда, и здесь появится день`}</div>
    <button class="btn" id="build" ${ready?"":"disabled"}>Собрать неделю</button></div></div>`;
}

function renderWeek(){
  const ppd = portionsPerDish(), L = shoppingList(), ids = Object.keys(S.profiles), people = ids.map(id=>S.profiles[id]);
  const plans = people.map(planFor), fits = L.dishCost<=S.budget;
  const total = 14*people.length;
  const per = ppd.map(({r,n}) => ({r, n}));
  document.getElementById("app").innerHTML = `
    <button class="back" id="back">← К блюдам</button>
    <h1 class="headline">Неделя собрана</h1>
    <p class="lede">${ppd.length} ${plural(ppd.length,"блюдо","блюда","блюд")}, ${total} ${plural(total,"контейнер","контейнера","контейнеров")} на двоих. Обед и ужин обойдутся примерно в <b class="${fits?'ok':'bad'}">${num(L.dishCost)} ₽</b> из ${num(S.budget)}.</p>

    <div class="panel"><h3>Раскладка по контейнерам</h3>
      ${per.map(({r,n})=>`<div class="pack"><span class="e" aria-hidden="true">${EMOJI[r.id]}</span><span class="t">${esc(r.name)}</span>
        <span class="c">${people.map((q,i)=>`<span class="chip">${esc(q.name)} <b>${n}</b></span>`).join("")}</span></div>`).join("")}
      <p class="small">Размер порции: ${people.map((q,i)=>esc(q.name)+" ×"+plans[i].factor.toFixed(2)).join(", ")}. Кому порция меньше, берёт контейнеры поменьше. В холодильнике готовое стоит 3–4 дня, порции на 5–7 день сразу в морозилку.</p></div>

    <div class="panel"><h3>День каждого</h3><table class="tbl">
      <tr><th></th>${people.map(q=>`<th>${esc(q.name)}</th>`).join("")}</tr>
      ${trow("Норма", plans.map(x=>num(x.n.kcal)+" ккал"))}
      ${trow("По плану", plans.map(x=>num(x.day)+" ккал"))}
      ${trow("Белок", plans.map(x=>Math.round(x.prot)+" из "+x.n.protein+" г"))}
    </table></div>

    <div class="panel">
      <div class="budget"><label for="budget">Бюджет на обед и ужин, ₽ в неделю</label><input id="budget" type="number" inputmode="numeric" step="500" value="${S.budget}"></div>
      <p class="small">${fits ? `Остаётся около ${num(S.budget-L.dishCost)} ₽.` : `Не хватает около ${num(L.dishCost-S.budget)} ₽. Замените блюдо с говядиной на куриное, курица дешевле.`}
      ${S.breakfasts ? ` Завтраки и перекусы отдельно, около ${num(L.bfCost)} ₽.` : ""} Цены примерные.</p></div>

    <div class="panel"><h3>Список покупок</h3>
      <button class="btn full" id="send">${inTg ? "Отправить список в чат" : "Скопировать список"}</button>
      ${CAT_ORDER.filter(c=>L.groups[c]).map(c=>{
        const items = L.groups[c], got = items.filter(it=>S.checked[it.name]).length, all = got===items.length;
        return `<div class="dept ${all?'done':''}"><h4>${c}</h4><span>${all?"всё взяли":got?`взяли ${got} из ${items.length}`:items.length+" "+plural(items.length,"позиция","позиции","позиций")}</span></div>`+
        items.map(it=>{ const done = S.checked[it.name];
          return `<label class="item ${done?'done':''}"><input type="checkbox" data-item="${esc(it.name)}" ${done?"checked":""}><span class="n">${esc(it.name)}</span><span class="q">${it.qty}</span></label>`;}).join("");}).join("")}
      <p class="small">Вес сырых продуктов, округлён вверх.</p>
    </div>`;
  document.getElementById("bar").innerHTML = `<div class="in"><div class="row">
    <button class="btn line" id="uncheck" style="flex:1">Снять все отметки</button></div></div>`;
}

function render(){
  S.view==="list" ? renderWeek() : renderPlan();
  if (inTg) { try { S.view==="list" ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1800); }
function listText(){
  const L = shoppingList();
  return "🛒 Список покупок на неделю\n" + CAT_ORDER.filter(c=>L.groups[c]).map(c=>"\n"+c+"\n"+L.groups[c].map(i=>"• "+i.name+" — "+i.qty).join("\n")).join("\n")
    + "\n\nПримерно " + num(L.cost) + " ₽";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-prof],[data-goal],[data-dish],#build,#back,#send,#uncheck");
  if (!t) return;
  if (t.dataset.prof) S.active = t.dataset.prof;
  else if (t.dataset.goal) S.profiles[S.active].goal = t.dataset.goal;
  else if (t.dataset.dish) { const id=t.dataset.dish; S.selected = S.selected.includes(id) ? S.selected.filter(x=>x!==id) : [...S.selected, id]; haptic(); }
  else if (t.id==="build") { S.view="list"; save(); render(); window.scrollTo(0,0); return; }
  else if (t.id==="back") { S.view="plan"; save(); render(); window.scrollTo(0,0); return; }
  else if (t.id==="uncheck") S.checked = {};
  else if (t.id==="send") {
    const txt = listText();
    // В Telegram открываем выбор чата: можно отправить в «Избранное» или супруге
    if (inTg) { try { tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(txt)); return; } catch(err){} }
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("Список скопирован"), ()=>toast("Не получилось скопировать. Выделите список вручную."));
    return;
  }
  const y = window.scrollY; save(); render(); window.scrollTo(0,y);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.f) {
    const p = S.profiles[S.active], f = t.dataset.f;
    p[f] = (f==="name"||f==="sex") ? t.value : (parseFloat(t.value)||p[f]);
    const wasSetup = S.setup; S.setup = true;
    save(); render();
    if (!wasSetup) { const d0 = document.querySelector("details.params"); if (d0) d0.open = true; }
    const d = document.querySelector("details.params"); if (d) d.open = true;
  } else if (t.id==="budget") { S.budget = parseInt(t.value)||S.budget; const y=window.scrollY; save(); render(); window.scrollTo(0,y); }
  else if (t.id==="bf") { S.breakfasts = t.checked; save(); render(); }
  else if (t.dataset.item) { S.checked[t.dataset.item] = t.checked; const y=window.scrollY; save(); render(); window.scrollTo(0,y); }
});
render();
</script>
</body>
</html>
