<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batch планер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js"></script>
<style>
/* Тема: кухня с заготовками. Стеклянные контейнеры, малярный скотч с подписью, свежая зелень. */
:root{
  --paper:#eef2ec; --glass:#fbfdfa; --ink:#16231c; --soft:#5d6d63; --rule:#d3dbd2;
  --herb:#2f6b4f; --herb-wash:#dcebe1; --tape:#f2d27a; --tape-ink:#3a2f12; --tomato:#d9472f;
  --display:"Unbounded",system-ui,sans-serif; --text:"Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111915; --glass:#1a241f; --ink:#e7efe9; --soft:#9aaba0; --rule:#2b3831;
    --herb:#6fc199; --herb-wash:#1f3a2c; --tape:#e6c567; --tape-ink:#2e250c; --tomato:#f06b52;
  }
}
:root[data-theme="dark"]{
  --paper:#111915; --glass:#1a241f; --ink:#e7efe9; --soft:#9aaba0; --rule:#2b3831;
  --herb:#6fc199; --herb-wash:#1f3a2c; --tape:#e6c567; --tape-ink:#2e250c; --tomato:#f06b52;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--herb);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.wrap.withbar{padding-bottom:132px}

/* Шапка, профили, разделы */
.top{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 14px}
.brand{font:700 21px/1 var(--display);letter-spacing:-.02em}
.brand small{font:500 13px var(--text);color:var(--soft);margin-left:6px;letter-spacing:0}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.person{background:transparent;border:0;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--rule)}
.person b{display:block;font-weight:600;font-size:15px}
.person span{font:500 19px/1.2 var(--display);letter-spacing:-.02em}
.person span small{font:400 12px var(--text);color:var(--soft);margin-left:4px}
.person.on{background:var(--herb);color:var(--glass);box-shadow:none}
.person.on span small{color:inherit;opacity:.8}
.tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 11px;font-weight:600;font-size:14.5px;color:var(--soft);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--herb)}
.tabs button:disabled{opacity:.4;cursor:default}

.goals{display:flex;background:var(--glass);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--rule);margin-bottom:6px}
.goals button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-weight:500;font-size:14px;cursor:pointer;color:var(--soft)}
.goals button.on{background:var(--herb-wash);color:var(--ink);font-weight:600}
.note{font-size:12.5px;color:var(--soft);margin:0 2px 12px}
.note.go{color:var(--herb);font-weight:500}

details.params{margin:0 0 16px;border-radius:16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--rule)}
details.params summary,details.how summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:500}
details.params summary{padding:12px 14px}
details summary::-webkit-details-marker{display:none}
details.params summary::after,details.how summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg);margin-top:-4px;transition:transform .2s;flex:none}
details[open].params summary::after,details[open].how summary::after{transform:rotate(-135deg);margin-top:4px}
details.params summary span{color:var(--soft);font-size:13px;margin-left:auto;margin-right:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.form label{font-size:12.5px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
input.f,select.f{background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:9px 10px;width:100%;font-size:15px}
.form .wide{grid-column:1/-1}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font:500 16px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--soft)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin:0 2px}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--glass);transition:transform .2s}
.switch input:checked{background:var(--herb)}
.switch input:checked::after{transform:translateX(16px)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;background:var(--glass);box-shadow:inset 0 0 0 1px var(--rule);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--paper);box-shadow:none}

/* Контейнеры с блюдами: главный визуальный приём */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.box{position:relative;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.lid{position:relative;height:96px;border-radius:20px;background:var(--glass);box-shadow:inset 0 0 0 2px var(--rule);display:flex;align-items:center;justify-content:center;font-size:42px;transition:box-shadow .15s,background .15s,transform .1s}
.lid::before,.lid::after{content:"";position:absolute;top:34px;width:7px;height:28px;border-radius:4px;background:var(--rule);transition:background .15s}
.lid::before{left:-3px}.lid::after{right:-3px}
.box.on .lid{background:var(--herb-wash);box-shadow:inset 0 0 0 2.5px var(--herb)}
.box.on .lid::before,.box.on .lid::after{background:var(--herb)}
.tape{position:relative;margin:-14px 10px 0;padding:7px 10px 8px;background:var(--tape);color:var(--tape-ink);font-weight:600;font-size:13.5px;line-height:1.22;transform:rotate(-1.2deg);
  clip-path:polygon(0 4%,3% 0,97% 3%,100% 0,99% 50%,100% 97%,96% 100%,4% 97%,0 100%,1% 50%)}
.box:nth-child(even) .tape{transform:rotate(1deg)}
.facts{display:flex;justify-content:space-between;align-items:baseline;margin:8px 4px 0;font-size:12.5px;color:var(--soft)}
.facts b{font:500 15px var(--display);color:var(--ink);letter-spacing:-.02em;margin-right:3px}
.facts .warm{color:var(--tomato)}
.stamp{position:absolute;top:8px;right:10px;font-size:12px;font-weight:600;color:var(--glass);background:var(--herb);border-radius:999px;padding:2px 9px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.box.on .stamp{opacity:1;transform:scale(1)}
.box:active .lid{transform:scale(.97)}
.warn{font-size:13px;color:var(--tomato);margin:14px 2px 0}

/* Нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--glass);box-shadow:0 -1px 0 var(--rule);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar:empty{display:none}
.bar .in{max-width:520px;margin:0 auto}
.meter{position:relative;height:8px;border-radius:999px;background:var(--rule);margin:2px 0 10px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--herb);transition:width .35s ease}
.meter.over i{background:var(--tomato)}
.bar .row{display:flex;align-items:center;gap:12px}
.bar .read{flex:1;font-size:12.5px;color:var(--soft);line-height:1.35}
.bar .read b{font:500 17px var(--display);color:var(--ink);letter-spacing:-.02em}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;background:var(--herb);color:var(--glass);white-space:nowrap}
.btn:disabled{background:var(--rule);color:var(--soft);cursor:default}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.full{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}

/* Экран недели */
.headline{font:700 26px/1.12 var(--display);letter-spacing:-.03em;margin:4px 0 8px}
.lede{font-size:15.5px;margin:0 0 16px;color:var(--soft)}
.lede b{color:var(--ink);font-weight:600}
.lede .ok{color:var(--herb)}.lede .bad{color:var(--tomato)}
.panel{background:var(--glass);border-radius:18px;box-shadow:inset 0 0 0 1px var(--rule);padding:14px;margin-bottom:12px}
.panel h3{font:500 15px var(--display);margin:0 0 10px;letter-spacing:-.01em}
.tip{background:var(--herb-wash);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--soft);font-size:12.5px;text-align:right;padding:0 0 6px}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 0;border-top:1px solid var(--rule);text-align:right}
.tbl td:first-child{text-align:left;color:var(--soft)}
.budget{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.budget input{width:96px;text-align:right}
.small{font-size:12.5px;color:var(--soft);margin:8px 0 0}

.dish-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.dish-head .e{font-size:30px;line-height:1;width:38px;text-align:center;flex:none}
.dish-head h3{margin:0 0 3px}
.dish-head p{margin:0;font-size:13px;color:var(--soft)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who{background:var(--paper);border-radius:14px;padding:10px 12px}
.who .nm{font-size:13px;color:var(--soft)}
.who .g{font:500 20px/1.2 var(--display);letter-spacing:-.02em;margin:3px 0 1px}
.who .g small{font:500 13px var(--text);color:var(--soft);letter-spacing:0}
.who .k{font-size:13px}
details.how{margin-top:10px;border-top:1px solid var(--rule)}
details.how summary{padding:12px 0 2px;font-weight:600;font-size:14.5px}
details.how summary span{margin-left:auto;margin-right:12px;color:var(--soft);font-weight:400;font-size:13px}
.how h4{font-size:13px;color:var(--soft);font-weight:500;margin:12px 0 4px}
.ing{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.ing span:last-child{font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap;padding-left:12px}
.how ol{margin:4px 0 0;padding-left:20px;font-size:14.5px;line-height:1.5}
.how ol li{margin:0 0 8px;padding-left:4px}
.how ol li::marker{font:500 13px var(--display);color:var(--herb)}

.dept{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.dept h4{margin:0;font-weight:600;font-size:14.5px}
.dept span{font-size:12.5px;color:var(--soft)}
.dept.done span{color:var(--herb);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}
.item input{appearance:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--rule);flex:none;cursor:pointer;display:grid;place-content:center;margin:0}
.item input:checked{background:var(--herb);box-shadow:none}
.item input:checked::after{content:"";width:6px;height:11px;border:solid var(--glass);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .n{flex:1;font-size:15px}
.item .q{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px;white-space:nowrap}
.item.done .n{text-decoration:line-through;color:var(--soft)}

/* Дневник */
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.daynav button{border:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--rule);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:18px}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav b{font-weight:600}
.eaten{text-align:center;margin:4px 0 12px}
.eaten .big{font:700 40px/1 var(--display);letter-spacing:-.04em}
.eaten .big small{font:500 15px var(--text);color:var(--soft);letter-spacing:0;margin-left:4px}
.eaten p{margin:6px 0 0;color:var(--soft);font-size:14px}
.eaten p b{color:var(--ink)}
.eaten p b.bad{color:var(--tomato)}
.log{margin:0;padding:0;list-style:none}
.log li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14.5px}
.log li:first-child{border-top:0}
.log .t{flex:1;line-height:1.25}
.log .t small{display:block;color:var(--soft);font-size:12px}
.log .k{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.log button{border:0;background:transparent;color:var(--soft);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px}
.empty{color:var(--soft);font-size:14px;margin:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qb{border:0;text-align:left;background:var(--paper);border-radius:12px;padding:9px 11px;cursor:pointer;line-height:1.25}
.qb span{display:block;font-size:13.5px;font-weight:500}
.qb small{font-size:12px;color:var(--soft)}
.qb:active{background:var(--herb-wash)}
.qb.meal{background:var(--herb-wash)}
.custom{display:grid;grid-template-columns:1fr 78px 64px;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,8px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) {
  try {
    tg.ready(); tg.expand();
    const applyTheme = () => {
      document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
      if (tg.setHeaderColor) tg.setHeaderColor(bg);
      if (tg.setBackgroundColor) tg.setBackgroundColor(bg);
      if (tg.setBottomBarColor) tg.setBottomBarColor(bg);
    };
    applyTheme(); tg.onEvent("themeChanged", applyTheme);
    tg.BackButton.onClick(() => go("plan"));
  } catch(e){}
}
const haptic = () => { try { inTg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch(e){} };

const RECIPES = window.RECIPES_DB.recipes;
const ING = window.INGREDIENTS;
const EMOJI = {"chicken-rice-teriyaki":"🍗","buckwheat-beef":"🥘","bolognese":"🍝","chicken-burrito":"🌯","chicken-plov":"🍛","turkey-meatballs-bulgur":"🧆","potato-casserole":"🥧","chicken-curry":"🍛","thighs-potato-mushrooms":"🍄","chili":"🌶️","chicken-cutlets-mash":"🥔","chicken-stroganoff":"🍲",
  "lagman":"🍜","mexican-chicken-rice":"🌽","lazy-golubtsy":"🥬","creamy-chicken-pasta":"🧀","turkey-ragout":"🥕","stuffed-peppers":"🫑",
  "pasta-bake-broccoli":"🥦","lentil-dal-chicken":"🫘","lavash-lasagna":"🫓","beef-goulash-mash":"🥩",
  "chicken-couscous":"🥒","chicken-buckwheat-mushrooms":"🍄","soy-honey-thighs":"🍯","yogurt-chicken-bulgur":"🍛","chicken-barley-stew":"🥘","chicken-chickpeas":"🫘",
  "shawarma":"🌯","oven-nuggets":"🍟","beef-plov":"🍚","beef-broccoli":"🥦","beef-cutlets-buckwheat":"🍔","navy-pasta":"🍝","kharcho":"🍲","lentil-soup":"🥣",
  "turkey-cream-pasta":"🍝","turkey-cutlets-bulgur":"🧆","turkey-soba":"🍜","baked-turkey-rice":"🫑","zucchini-casserole":"🥧","french-chicken":"🧀",
  "cabbage-chicken":"🥬","fried-rice":"🍳","chicken-paella":"🥘","beef-stroganoff-mash":"🥩","creamy-chicken-meatballs":"🧆","moroccan-beef":"🫕",
  "chicken-bulgur-tomato":"🍅","beef-barley-mushrooms":"🍄"};
const SOUPS = ["kharcho","lentil-soup"];
function meatOf(r){
  const s = r.ingredients.map(i=>i[0]).join(" ");
  if (/индейк/.test(s)) return "turkey";
  if (/говяд|говяжий/.test(s)) return "beef";
  return "chicken";
}
const FILTERS = [["all","Все"],["picked","Выбранные"],["chicken","Курица"],["beef","Говядина"],["turkey","Индейка"],["soup","Супы"],["light","До 600 ккал"]];

// Завтрак + перекус на день для списка покупок: эталон ~986 ккал. Масштабируется под норму каждого.
const BFAST = {kcal:986, protein:74, items:[["яйцо",165],["творог 5%",200],["овсяные хлопья",50],["молоко 2,5%",200],["банан",120],["кефир 1%",250]]};
// Быстрое добавление в дневник: завтраки и перекусы
const FOODS = [
  ["Яйца, 2 шт",172,14],["Омлет из 3 яиц",300,20],["Творог 5%, 200 г",242,34],["Овсянка на молоке",280,12],
  ["Йогурт греческий, 150 г",105,13],["Кефир 1%, стакан",100,8],["Банан",105,1],["Яблоко",80,0],
  ["Хлеб ржаной, кусок",65,2],["Бутерброд с сыром",160,8],["Сыр, 30 г",90,8],["Орехи, горсть 30 г",185,5],
  ["Протеиновый коктейль",120,24],["Кофе с молоком",60,3],["Шоколад, 4 дольки",135,2],["Сырники, 2 шт",280,16]];
const CAT_ORDER = ["Мясо и птица","Молочка и яйца","Овощи и зелень","Фрукты","Крупы и макароны","Хлеб","Бакалея"];
const DISH_SHARE = 0.6; // обед + ужин = 60% нормы, завтрак + перекус = 40%

// Личные данные в коде не храним: каждый вводит свои параметры в приложении.
const DEF = {active:"a", view:"plan", selected:[], breakfasts:true, checked:{}, budget:5000, setup:false, filter:"all", diary:{},
  profiles:{
    a:{name:"Муж",sex:"m",age:30,height:180,weight:90,target:80,act:1.375,goal:"lose"},
    b:{name:"Жена",sex:"f",age:30,height:165,weight:65,target:58,act:1.375,goal:"lose"}}};
const KEY = "batch-planner", KEY_D = "batch-diary";
const cloud = inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
if (!S) S = JSON.parse(JSON.stringify(DEF));
if (!S.budget) S.budget = 5000;
if (S.setup === undefined) S.setup = true;
if (!S.diary) S.diary = {};
if (!S.filter) S.filter = "all";
S.selected = S.selected.filter(id => RECIPES.some(r=>r.id===id));
let dayOff = 0; const openRecipes = new Set();

const dkey = off => { const d = new Date(); d.setDate(d.getDate()+off); return d.toLocaleDateString("sv-SE"); };
function pruneDiary(keepDays){
  const out = {}, min = dkey(-keepDays);
  Object.entries(S.diary).forEach(([pid,days]) => { out[pid] = {}; Object.entries(days).forEach(([d,list]) => { if (d >= min && list.length) out[pid][d] = list; }); });
  return out;
}
let cloudTimer;
function save(){
  S.diary = pruneDiary(30);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  // Облако Telegram: настройки не теряются при очистке кэша и переезжают на новый телефон
  if (cloud) { clearTimeout(cloudTimer); cloudTimer = setTimeout(()=>{ try {
    const main = Object.assign({}, S, {diary:undefined});
    cloud.setItem(KEY, JSON.stringify(main));
    cloud.setItem(KEY_D, JSON.stringify(pruneDiary(2)));

function norms(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="m"?5:-161);
  const tdee = bmr*p.act;
  const bmi = p.weight/Math.pow(p.height/100,2);
  const k = {lose: 1-(bmi>=30?0.24:0.20), keep:1, gain:1.1};
  const r10 = x => Math.round(x/10)*10;
  const ref = bmi>=25 ? (p.target||p.weight) : p.weight;
  return {lose:r10(tdee*k.lose), keep:r10(tdee), gain:r10(tdee*k.gain), kcal:r10(tdee*k[p.goal]),
          protein:Math.round(1.8*ref), bmi:bmi, deficit:bmi>=30?24:20};
}
function selRecipes(){ return RECIPES.filter(r => S.selected.includes(r.id)); }
function planFor(p){
  const n = norms(p), sel = selRecipes();
  if (!sel.length) return {n, factor:0, day:0, prot:0, dishK:0, bK:0};
  const avgK = sel.reduce((a,r)=>a+r.kcal,0)/sel.length;
  const avgP = sel.reduce((a,r)=>a+r.protein,0)/sel.length;
  let factor = Math.round((DISH_SHARE*n.kcal)/(2*avgK)/0.05)*0.05;
  factor = Math.min(1.6, Math.max(0.5, factor));
  const dishK = 2*avgK*factor, bK = (1-DISH_SHARE)*n.kcal;
  const prot = 2*avgP*factor + BFAST.protein*bK/BFAST.kcal;
  return {n, factor, dishK, bK, day:dishK+bK, prot};
}
// Вес готового блюда на 1 порцию: сырой вес × уварка/разварка + вода в супах
function cookedG(r){ return r.ingredients.reduce((a,[name,g]) => a + g*((ING[name]||[])[2]||1), 0) + (r.water||0); }
// Порция конкретного человека: граммы готового, ккал, белок
function portion(r, factor){ return {g: Math.round(cookedG(r)*factor/10)*10, k: Math.round(r.kcal*factor/5)*5, p: Math.round(r.protein*factor)}; }
// 14 приёмов (обед + ужин × 7) на человека, распределяем по выбранным блюдам
function portionsPerDish(){
  const sel = selRecipes(), base = Math.floor(14/sel.length), extra = 14%sel.length;
  return sel.map((r,i)=>({r, n: base + (i<extra?1:0)}));
}
function fmtQty(name, g){
  const piece = (ING[name]||[])[3];
  if (piece) return Math.ceil(g/piece)+" шт";
  const gr = g<100 ? Math.ceil(g/10)*10 : g<1000 ? Math.ceil(g/50)*50 : Math.ceil(g/100)*100;
  const liq = /молоко|кефир|сливки/.test(name);
  return gr>=1000 ? (gr/1000).toLocaleString("ru-RU")+(liq?" л":" кг") : gr+(liq?" мл":" г");
}
function costOfMap(map){
  return Object.entries(map).reduce((a,[name,g]) => { const [,price=0,,piece] = ING[name]||[];
    return a + (piece ? Math.ceil(g/piece)*price : g/1000*price); }, 0);
}
function shoppingList(){
  const people = Object.values(S.profiles).map(planFor);
  const dishT = {}, bfT = {}, totals = {};
  const add = (map,name,g) => { map[name] = (map[name]||0) + g; };
  portionsPerDish().forEach(({r,n}) => {
    const mult = people.reduce((a,pl)=>a + n*pl.factor, 0);
    r.ingredients.forEach(([name,g]) => { add(totals,name,g*mult); add(dishT,name,g*mult); });
  });
  if (S.breakfasts) people.forEach(pl => {
    const k = pl.bK/BFAST.kcal*7;
    BFAST.items.forEach(([name,g]) => { add(totals,name,g*k); add(bfT,name,g*k); });
  });
  const groups = {};
  Object.entries(totals).forEach(([name,g]) => { const cat = (ING[name]||["Бакалея"])[0]; (groups[cat] = groups[cat]||[]).push({name, qty: fmtQty(name,g)}); });
  const r100 = x => Math.round(x/100)*100;
  return {groups, cost: r100(costOfMap(totals)), dishCost: r100(costOfMap(dishT)), bfCost: r100(costOfMap(bfT))};
}

  if (t.dataset.view) return go(t.dataset.view);
  if (t.id==="build") return go("list");
  if (t.dataset.prof) S.active = t.dataset.prof;
  else if (t.dataset.goal) S.profiles[S.active].goal = t.dataset.goal;

    // В Telegram открываем выбор чата: можно отправить в «Избранное» или супруге
    if (inTg) { try { tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(txt)); return; } catch(err){} }
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("Список скопирован"), ()=>toast("Не получилось скопировать. Выделите список вручную."));
    return;
  }
  const y = window.scrollY; save(); render(); window.scrollTo(0,y);
});
document.addEventListener("change", e => {
  const t = e.target, y = window.scrollY;
  if (t.dataset.f) {
    const p = S.profiles[S.active], f = t.dataset.f;
    p[f] = (f==="name"||f==="sex") ? t.value : (parseFloat(t.value)||p[f]);
    S.setup = true; save(); render();
    const d = document.querySelector("details.params"); if (d) d.open = true;
  } else if (t.id==="budget") { S.budget = parseInt(t.value)||S.budget; save(); render(); }
  else if (t.id==="bf") { S.breakfasts = t.checked; save(); render(); }
  else if (t.dataset.item) { S.checked[t.dataset.item] = t.checked; save(); render(); }
  else return;
  window.scrollTo(0,y);
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.rid) return;
  d.open ? openRecipes.add(d.dataset.rid) : openRecipes.delete(d.dataset.rid);
}, true);
render();
</script>
</body>
</html>
